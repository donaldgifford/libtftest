---
# yaml-language-server: $schema=https://www.schemastore.org/pull-request-labeler.json
# Path- and branch-based PR labels, applied by actions/labeler in ci.yml.
# Every label named here must exist in the repo: scripts/labels.sh creates
# them from this file plus pr-labels.yml. Quotation marks are required for
# globs with a leading asterisk.

# Any Go source anywhere in the module (root package, per-service assert/
# and fixtures/ packages, cmd/, internal/, tools/, ...).
go:
  - changed-files:
      - any-glob-to-any-file: "**/*.go"

dependencies:
  - changed-files:
      - any-glob-to-any-file: go.mod
      - any-glob-to-any-file: go.sum
      - any-glob-to-any-file: mise.toml
      - any-glob-to-any-file: renovate.json5
      - any-glob-to-any-file: .github/dependabot.yml

documentation:
  - changed-files:
      - any-glob-to-any-file: docs/**
      - any-glob-to-any-file: README.md
      - any-glob-to-any-file: CHANGELOG.md
      - any-glob-to-any-file: .docz.yaml

# CI and task-runner plumbing.
ci:
  - changed-files:
      - any-glob-to-any-file: .github/**
      - any-glob-to-any-file: justfile
      - any-glob-to-any-file: "*.just"

# Repo-level tool configuration.
repo:
  - changed-files:
      - any-glob-to-any-file: .codecov.yml
      - any-glob-to-any-file: .golangci.yml
      - any-glob-to-any-file: .goreleaser.yml
      - any-glob-to-any-file: .markdownlint.yaml
      - any-glob-to-any-file: .prettierrc.yaml
      - any-glob-to-any-file: .yamlfmt.yml
      - any-glob-to-any-file: .yamllint.yml
      - any-glob-to-any-file: cliff.toml
      - any-glob-to-any-file: catalog-info.yaml
      - any-glob-to-any-file: .gitignore
      - any-glob-to-any-file: scripts/**

docker:
  - changed-files:
      - any-glob-to-any-file: "Dockerfile*"
      - any-glob-to-any-file: docker-bake.hcl
      - any-glob-to-any-file: .dockerignore
      - any-glob-to-any-file: docker.just

# Claude Code skills, agents, settings, and the project instructions file.
ai:
  - changed-files:
      - any-glob-to-any-file: .claude/**
      - any-glob-to-any-file: CLAUDE.md

# Branch-name labels: applied when the head branch starts with, or contains
# a segment equal to, the label name (git-workflow:branch convention).
feature:
  - head-branch: ["^feature", "feature"]
fix:
  - head-branch: ["^fix", "fix"]
chore:
  - head-branch: ["^chore", "chore"]
docs:
  - head-branch: ["^docs", "docs"]
security:
  - head-branch: ["^security", "security"]
