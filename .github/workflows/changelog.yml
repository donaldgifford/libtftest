---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Changelog Drift Check
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
      - name: Generate fresh CHANGELOG
        # git-cliff renders version headers from tags; make sure the PR
        # merge ref sees every tag, including ones moved since the clone.
        run: |
          git fetch --tags --force origin
          git-cliff -o CHANGELOG.generated.md
      - name: Diff against committed CHANGELOG
        run: |-
          if ! diff -q CHANGELOG.md CHANGELOG.generated.md > /dev/null; then
            echo "::error::CHANGELOG.md is stale. Run 'git-cliff -o CHANGELOG.md' and commit."
            diff CHANGELOG.md CHANGELOG.generated.md || true
            exit 1
          fi
